<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* 抢先应用用户选过的主题：深色偏好下别先闪一下白（这是唯一的"内联脚本"，只干这件事） */
  try { var t = localStorage.getItem('mtp-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<title>维护历史 · Music Theory Playground</title>
<meta name="description" content="Music Theory Playground 的维护历史：每个版本加了什么、什么时候落地，从 v0.1 立项到今天。">
<!-- share-meta -->
<!-- 分享卡片与图标。这三行 og 决定链接转出去长什么样：抓不到就只剩一条光秃秃的灰链接。
     这一块由 node scripts/sync-share-meta.mjs 生成，别手改（下次跑会被抹平）。 -->
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Music Theory Playground">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="维护历史 · Music Theory Playground">
<meta property="og:description" content="Music Theory Playground 的维护历史：每个版本加了什么、什么时候落地，从 v0.1 立项到今天。">
<meta property="og:url" content="https://cuberrobot.github.io/Music-Theory-Playground/changelog/">
<meta property="og:image" content="https://cuberrobot.github.io/Music-Theory-Playground/assets/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- /share-meta -->
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components.css">
</head>
<body data-root="../" data-page="changelog">

<header class="topbar">
  <a class="brand" href="../">Music Theory Playground</a>
  <nav class="topnav" aria-label="站点导航"><a href="../lessons/">课程地图</a></nav>
  <span class="spacer"></span>
  <span class="meter" data-meter role="img" aria-label="课程进度"></span>
  <button class="btn btn-ghost" type="button" data-sound aria-pressed="false">声音</button>
</header>

<div class="shell--full">
  <section class="hero" style="margin-bottom: var(--sp-6)">
    <p class="kicker">维护历史</p>
    <h1>每个版本加了什么</h1>
    <p class="lead-p">这是一份流水账，不是宣传页 —— 记的是"用户能感觉到的东西"，
    以及那些被用户抓出来的错误最后变成了哪条防线。</p>
    <p>当前版本 <b data-version></b>（<span data-updated></span> 更新）。
    版本号只在跨过一个阶段时进位：0.x 是内容建设，1.0 起进入维护阶段。</p>
  </section>

  <div data-changelog></div>

  <footer class="page-foot">
    <span data-license></span>
    <span><a href="../">回首页</a></span>
  </footer>
</div>

<script type="module" src="../src/js/main.js"></script>
</body>
</html>
