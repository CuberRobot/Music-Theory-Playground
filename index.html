<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* 抢先应用用户选过的主题：深色偏好下别先闪一下白（这是唯一的"内联脚本"，只干这件事） */
  try { var t = localStorage.getItem('mtp-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<title>Music Theory Playground · 看得见的乐理</title>
<meta name="description" content="一个用交互实验台讲乐理的静态站。从泛音列和十二平均律开始，先把声音拆开，再谈音乐。">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/components.css">
</head>
<body class="landing">

<div class="orbs" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
</div>

<header class="topbar topbar--plain">
  <a class="brand" href="./">Music Theory Playground</a>
  <span class="spacer"></span>
  <nav class="topnav" aria-label="站点导航">
    <!-- 页眉只放"站内内容入口"。关于 / 更新 与项目外链（GitHub / 博客 / 许可）都在页脚那一行。
         门面页不挂 main.js，这份是静态标记：加顶级入口要改两处（main.js + 这里），漏改审计会拦。 -->
    <a href="./lessons/">课程地图</a>
    <a href="./search/">搜索</a>
    <a href="./glossary/">术语表</a>
  </nav>
  <!-- 门面页不挂 main.js，所以主题开关这颗按钮写在 HTML 里，由 theme.js 接上 -->
  <button class="btn btn-ghost" type="button" data-theme-toggle>深色</button>
</header>

<main class="landing-stage">
  <section class="glass">
    <p class="kicker">看得见的乐理 · See it, play it, hear it.</p>
    <h1>先把声音拆开，再谈音乐</h1>
    <p>每个概念都配一个能拖、能听、能看见结果的实验台。</p>
    <div class="actions">
      <a class="btn btn-primary" href="./lessons/">进入课程地图</a>
      <a class="btn" href="./search/">搜索</a>
    </div>
  </section>

  <p class="landing-note">
    乐理基础 · 编曲作曲 · 作品分析 · 风格解析　—　代码 MIT · 内容 CC BY-SA 4.0
  </p>

  <!-- 页脚 = 站点地图：页眉放不下的都在这里，一项不少。
       （门面页刻意不放交互，所以这份也是写死的静态标记） -->
  <p class="site-links site-links--center">
    <a href="./lessons/">课程地图</a>
    <span aria-hidden="true">·</span>
    <a href="./search/">搜索</a>
    <span aria-hidden="true">·</span>
    <a href="./glossary/">术语表</a>
    <span aria-hidden="true">·</span>
    <a href="./about/">关于</a>
    <span aria-hidden="true">·</span>
    <a href="./changelog/">更新</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/CuberRobot/Music-Theory-Playground">GitHub 仓库</a>
    <span aria-hidden="true">·</span>
    <a href="https://jimmyland.me/">博客 jimmyland.me</a>
    <span aria-hidden="true">·</span>
    <a href="https://jimmyland.me/projects/">其他项目</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/CuberRobot/Music-Theory-Playground/blob/main/LICENSE-CONTENT">许可</a>
  </p>
</main>

<script type="module">
  import { wireToggle } from './src/js/theme.js';
  wireToggle(document.querySelector('[data-theme-toggle]'));
</script>

</body>
</html>
