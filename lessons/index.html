<header class="topbar">
  <a class="brand" href="../">Music Theory Playground</a>
  <nav class="topnav" aria-label="站点导航">
    <a href="./" aria-current="page">课程地图</a>
  </nav>
  <span class="spacer"></span>
  <span class="meter" data-meter role="img" aria-label="课程进度"></span>

</header>

<div class="shell--full">

  <section class="hero">
    <p class="kicker">课程地图</p>
    <h1>六层，从声音本身开始</h1>
    <p class="lead-p">这份顺序是刻意从底层往上建的，不是按传统教材的目录抄的。</p>
    <p>传统乐理书通常从"音名、谱号、音符"讲起——那些是<b>记录音乐的工具</b>，不是音乐本身。
    这里改成先问"一个音到底是什么"，再问"音高之间的距离是怎么被定出来的"，
    然后才谈音程、和弦、调。好处是后面每一条规则都能追到它的来源。</p>
    <p class="hint">点任意一张卡片进入。每一节的结构都一样：先玩一个能出声的东西，再解释它，最后小结。</p>
  </section>

  <section class="home-section">
    <div data-map></div>
  </section>

  <footer class="page-foot">
